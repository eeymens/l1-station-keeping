name: collect-artifacts

# Copy the trained models, logs and learning curves from a training run's
# artifacts into a branch (artifacts/<run id>), so they can be fetched with git
# and merged into main. Used for the CI training runs (train-lstm, train-moon).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "id of the training workflow run"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: _artifacts
      - name: Commit to artifacts/${{ inputs.run_id }}
        run: |
          for d in _artifacts/*/; do cp -r "$d"* . ; done
          rm -r _artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "artifacts/${{ inputs.run_id }}"
          git add -f models experiments figures
          git commit -m "Trained models from run ${{ inputs.run_id }}"
          git push origin "artifacts/${{ inputs.run_id }}"
