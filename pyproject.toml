[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l1-station-keeping"
version = "0.1.0"
description = "Station-keeping at the unstable Sun-Earth L1 point: LQR vs reinforcement learning in the circular restricted three-body problem"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emir Eymen Sargın" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
